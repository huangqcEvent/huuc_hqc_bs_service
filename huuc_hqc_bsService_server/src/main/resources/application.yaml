server:
  port: 8080
spring:
  profiles:
    active: dev
  datasource:
    druid:
      driver-class-name: ${hqc.datasource.driver-class-name}
      url: jdbc:mysql://${hqc.datasource.host}:${hqc.datasource.port}/${hqc.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${hqc.datasource.username}
      password: ${hqc.datasource.password}
  banner:
    location: static/banner.txt
  redis:
    host: ${hqc.redis.host}
    port: ${hqc.redis.port}
    password: ${hqc.redis.password}
    database: ${hqc.redis.database}
  rabbitmq:
    host: ${hqc.rabbitmq.host}
    port: ${hqc.rabbitmq.port}
    username: ${hqc.rabbitmq.username}
    password: ${hqc.rabbitmq.password}
    virtual-host: ${hqc.rabbitmq.virtual-host}
    connection-timeout: 1s # 设置MQ的连接超时时间
    template:
      retry:
        enabled: true # 开启超时重试机制
        initial-interval: 1000ms # 失败后的初始等待时间
        multiplier: 1 # 失败后下次的等待时长倍数，下次等待时长 = initial-interval * multiplier
        max-attempts: 3 # 最大重试次数
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#配置各级日志输出的级别
logging:
  level:
    org.springframework.amqp.rabbit: DEBUG
    com:
      huuc:
        mapper: debug
        service: info
        controller: info

# knife4j配置
knife4j:
  enable: true

# mybatis配置开启小驼峰
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# pageHelper分页插件
pagehelper:
  #配置四項 hprs
  helper-dialect: mysql  #分页助手方言：mysql
  params: count=countSql  #为了支持 startPage(Object params) 方法
  support-methods-arguments: true  #支持通过 Mapper 接口参数来传递分页参数，默认值 false
  reasonable: true #分页合理化参数，默认值为 false,页码不为负，不超总页码